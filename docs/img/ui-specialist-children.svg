<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="system-ui, sans-serif" font-size="14">
  <title>Uzmanın çocuk listesi (M2) – taslak</title>
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Üst çubuk -->
  <rect width="960" height="56" fill="#f2f2f2"/>
  <line x1="0" y1="56" x2="960" y2="56" stroke="#999999"/>
  <g fill="#ffffff" stroke="#999999">
    <rect x="752" y="16" width="80" height="24" rx="12"/>
    <rect x="848" y="12" width="88" height="32" rx="4"/>
  </g>
  <g fill="#333333">
    <text x="24" y="35" font-size="18" font-weight="bold">Çocuk Gelişim Platformu</text>
    <text x="740" y="33" text-anchor="end">Elif Kaya</text>
    <text x="792" y="33" font-size="13" text-anchor="middle">Uzman</text>
    <text x="892" y="33" text-anchor="middle">Çıkış yap</text>
  </g>

  <g fill="#333333">
    <text x="24" y="96" font-size="20" font-weight="bold">Çocuklarım</text>
    <text x="24" y="120" font-size="13">Yalnızca şu anda bağlı olduğunuz çocuklar listelenir.</text>
  </g>

  <!-- Çocuk satırları -->
  <g fill="#f2f2f2" stroke="#999999">
    <rect x="24" y="140" width="912" height="88" rx="6"/>
    <rect x="24" y="242" width="912" height="88" rx="6"/>
    <rect x="24" y="344" width="912" height="88" rx="6"/>
  </g>
  <g fill="#ffffff" stroke="#999999">
    <circle cx="68" cy="184" r="22"/>
    <circle cx="68" cy="286" r="22"/>
    <circle cx="68" cy="388" r="22"/>
  </g>
  <g fill="#3b6ea5">
    <rect x="800" y="166" width="116" height="36" rx="4"/>
    <rect x="800" y="268" width="116" height="36" rx="4"/>
    <rect x="800" y="370" width="116" height="36" rx="4"/>
  </g>
  <g fill="#333333" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="68" y="189">CD</text>
    <text x="68" y="291">EY</text>
    <text x="68" y="393">DA</text>
  </g>
  <g fill="#333333" font-size="16" font-weight="bold">
    <text x="104" y="178">Can Demir</text>
    <text x="104" y="280">Ela Yıldız</text>
    <text x="104" y="382">Deniz Aksoy</text>
  </g>
  <g fill="#333333" font-size="13">
    <text x="104" y="200">Ebeveyn: Ayşe Demir · Bağlantı tarihi: 12.10.2026</text>
    <text x="104" y="302">Ebeveyn: Selin Yıldız · Bağlantı tarihi: 03.09.2026</text>
    <text x="104" y="404">Ebeveyn: Burcu Aksoy · Bağlantı tarihi: 21.09.2026</text>
    <text x="536" y="189">Bu hafta: 5 görevden 3'ü tamamlandı</text>
    <text x="536" y="291">Bu hafta: 2 görevden 1'i tamamlandı</text>
    <text x="536" y="393">Bu hafta görev yok</text>
  </g>
  <g fill="#ffffff" font-weight="bold" text-anchor="middle">
    <text x="858" y="189">Görüntüle</text>
    <text x="858" y="291">Görüntüle</text>
    <text x="858" y="393">Görüntüle</text>
  </g>

  <!-- Not -->
  <rect x="24" y="548" width="912" height="32" rx="4" fill="none" stroke="#999999" stroke-dasharray="4 4"/>
  <text x="40" y="568" font-size="12" font-style="italic" fill="#333333">Not: Ebeveyn bağlantıyı kaldırınca çocuk bu listeden çıkar ve o çocuğun kayıtlarına erişim reddedilir.</text>
</svg>
