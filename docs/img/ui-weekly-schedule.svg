  <text x="40" y="568" font-size="12" font-style="italic" fill="#333333">Not: Etkinlikler gün ve saate göre sıralanır. Çocuk yalnızca kendi etkinliklerini görür; onun ekranında “Etkinlik ekle” yoktur.</text>
