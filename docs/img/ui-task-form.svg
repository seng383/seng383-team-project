<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="system-ui, sans-serif" font-size="14">
  <title>Görev atama formu (M4) – taslak</title>
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Üst çubuk -->
  <rect width="960" height="56" fill="#f2f2f2"/>
  <line x1="0" y1="56" x2="960" y2="56" stroke="#999999"/>
  <g fill="#ffffff" stroke="#999999">
    <rect x="752" y="16" width="80" height="24" rx="12"/>
    <rect x="848" y="12" width="88" height="32" rx="4"/>
  </g>
  <g fill="#333333">
    <text x="24" y="35" font-size="18" font-weight="bold">Çocuk Gelişim Platformu</text>
    <text x="740" y="33" text-anchor="end">Elif Kaya</text>
    <text x="792" y="33" font-size="13" text-anchor="middle">Uzman</text>
    <text x="892" y="33" text-anchor="middle">Çıkış yap</text>
  </g>

  <!-- Çocuk sekmeleri -->
  <line x1="0" y1="104" x2="960" y2="104" stroke="#999999"/>
  <line x1="124" y1="68" x2="124" y2="92" stroke="#999999"/>
  <g fill="#333333">
    <text x="24" y="86" font-size="16" font-weight="bold">Can Demir</text>
    <text x="144" y="86">Haftalık program</text>
    <text x="289" y="86" font-weight="bold">Görevler</text>
    <text x="376" y="86">Uzman notları</text>
    <text x="498" y="86">Belgeler</text>
    <text x="582" y="86">İstatistikler</text>
    <text x="683" y="86">Haftalık özet</text>
  </g>
  <rect x="289" y="101" width="59" height="3" fill="#333333"/>

  <!-- Yeni görev formu -->
  <rect x="24" y="120" width="520" height="428" rx="8" fill="#f2f2f2" stroke="#999999"/>
  <g fill="#ffffff" stroke="#999999">
    <rect x="44" y="186" width="480" height="36" rx="4"/>
    <rect x="44" y="252" width="480" height="60" rx="4"/>
    <rect x="44" y="344" width="230" height="36" rx="4"/>
    <rect x="294" y="344" width="230" height="36" rx="4"/>
    <rect x="44" y="382" width="230" height="130" rx="4"/>
    <rect x="294" y="468" width="96" height="36" rx="4"/>
  </g>
  <rect x="45" y="383" width="228" height="25" fill="#f2f2f2"/>
  <rect x="294" y="412" width="230" height="36" rx="4" fill="#f2f2f2" stroke="#999999" stroke-dasharray="4 3"/>
  <rect x="402" y="468" width="122" height="36" rx="4" fill="#3b6ea5"/>
  <g fill="none" stroke="#333333" stroke-width="2">
    <path d="M250 365 L256 359 L262 365"/>
    <path d="M248 395 L252 399 L260 391"/>
  </g>
  <rect x="496" y="354" width="16" height="16" rx="2" fill="none" stroke="#333333"/>
  <line x1="496" y1="359" x2="512" y2="359" stroke="#333333"/>
  <g fill="#333333">
    <text x="44" y="150" font-size="16" font-weight="bold">Yeni görev</text>
    <g font-size="13" font-weight="bold">
      <text x="44" y="178">Başlık *</text>
      <text x="44" y="244">Açıklama</text>
      <text x="44" y="336">Gelişim alanı *</text>
      <text x="294" y="336">Son tarih *</text>
      <text x="294" y="404">Durum</text>
    </g>
    <text x="56" y="209">5 yeni kelimeyi cümle içinde kullan</text>
    <text x="56" y="274">Öğrendiğin kelimelerle ailene beş kısa cümle kur.</text>
    <text x="56" y="367">Dil</text>
    <text x="306" y="367">04.11.2026</text>
    <text x="60" y="400" font-weight="bold">Dil</text>
    <text x="60" y="426">Motor beceriler</text>
    <text x="60" y="452">Sosyal-duygusal</text>
    <text x="60" y="478">Bilişsel</text>
    <text x="60" y="504">Öz bakım</text>
    <text x="306" y="435">Yapılmadı</text>
    <text x="512" y="435" font-size="12" font-style="italic" text-anchor="end">otomatik</text>
    <text x="342" y="491" text-anchor="middle">Vazgeç</text>
    <text x="44" y="534" font-size="12">* Zorunlu alan. Eksikse görev kaydedilmez ve hata gösterilir.</text>
  </g>
  <text x="463" y="491" font-weight="bold" text-anchor="middle" fill="#ffffff">Kaydet</text>

  <!-- Atanan görevlerin durumu -->
  <rect x="568" y="120" width="368" height="428" rx="8" fill="#f2f2f2" stroke="#999999"/>
  <g fill="#ffffff" stroke="#999999">
    <rect x="588" y="188" width="328" height="64" rx="4"/>
    <rect x="588" y="262" width="328" height="64" rx="4"/>
    <rect x="588" y="336" width="328" height="64" rx="4"/>
  </g>
  <g fill="#f2f2f2" stroke="#999999">
    <rect x="820" y="218" width="84" height="24" rx="12"/>
    <rect x="820" y="292" width="84" height="24" rx="12"/>
    <rect x="820" y="366" width="84" height="24" rx="12"/>
  </g>
  <path d="M832 304 L835 307 L841 301" fill="none" stroke="#333333" stroke-width="2"/>
  <g fill="#333333">
    <text x="588" y="150" font-size="16" font-weight="bold">Atadığım görevler</text>
    <text x="588" y="172" font-size="12">Durum, çocuk görevi işaretleyince güncellenir.</text>
    <g font-size="13" font-weight="bold">
      <text x="600" y="212">Resimli kitaptan 5 sayfa oku</text>
      <text x="600" y="286">Hikâyeyi kendi cümlelerinle anlat</text>
      <text x="600" y="360">Makasla çizgi boyunca kes</text>
    </g>
    <g font-size="12">
      <text x="600" y="234">Dil · 30.10.2026</text>
      <text x="600" y="308">Dil · 28.10.2026</text>
      <text x="600" y="382">Motor beceriler · 31.10.2026</text>
      <text x="862" y="234" text-anchor="middle">Yapılmadı</text>
      <text x="848" y="308">Yapıldı</text>
      <text x="862" y="382" text-anchor="middle">Yapılmadı</text>
    </g>
  </g>
</svg>
